<!doctype html>
<html lang="es" data-letra="normal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banco simulado</title>
  <meta name="theme-color" content="#f5f1ea">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app wide">
    <header class="topbar">
      <a class="brand" href="/banco.html">
        <span class="logo"><svg class="i"><use href="/icons.svg#bank"/></svg></span>
        <span>Banco simulado <small>· Escudo Centinela</small></span>
      </a>
      <span class="tag">Demo de integración bancaria</span>
    </header>
    <main>
      <div class="grid-2">
        <section aria-labelledby="acc" style="margin:16px 0">
          <h2 id="acc" class="sr-only">Cuenta</h2>
          <div class="bank-card">
            <div class="bc-top">
              <div><p class="bc-label">Saldo disponible</p><p class="small" id="entity" style="margin:2px 0 0;opacity:.85">—</p></div>
              <span class="chip-ic" aria-hidden="true"></span>
            </div>
            <p class="big-number" id="balance">—</p>
            <div class="bc-foot"><span class="bc-iban" id="iban">—</span><span id="holder"></span></div>
          </div>
        </section>
        <section class="card" aria-labelledby="shield-title">
          <div class="card-title"><h2 id="shield-title">Escudo bancario</h2><span id="shield-pill" class="pill">En espera</span></div>
          <div class="shield-panel" style="margin-top:14px">
            <div class="shield-ring" id="shield-ring"><svg class="i"><use href="/icons.svg#shield"/></svg></div>
            <div style="min-width:0">
              <div class="countdown hidden" id="countdown">--:--</div>
              <p id="shield-status" class="muted" style="margin:4px 0 0">—</p>
            </div>
          </div>
          <div class="row" style="margin-top:16px">
            <button class="btn btn-outline btn-small" id="btn-shield-on"><svg class="i"><use href="/icons.svg#lock"/></svg> Activar 60 min</button>
            <button class="btn btn-ghost btn-small" id="btn-shield-off">Desactivar</button>
          </div>
        </section>
      </div>
      <div class="grid-2">
        <section class="card" aria-labelledby="tx-title">
          <h2 id="tx-title">Nueva transferencia o Bizum</h2>
          <p class="muted small">Así se ve lo que pasaría si la persona intenta pagar al estafador después del aviso.</p>
          <div class="presets">
            <button class="preset" id="preset-scam"><span class="badge rojo"><svg class="i"><use href="/icons.svg#alert"/></svg></span><span><strong>Pagar al «hijo»</strong><span>680 € a una cuenta nueva</span></span></button>
            <button class="preset" id="preset-ok"><span class="badge verde"><svg class="i"><use href="/icons.svg#user"/></svg></span><span><strong>Pagar a Lucía</strong><span>25 € a una cuenta habitual</span></span></button>
          </div>
          <div class="grid-2" style="gap:0 16px">
            <div><label for="tx-benef">Beneficiario</label><input id="tx-benef" type="text"></div>
            <div><label for="tx-iban">IBAN</label><input id="tx-iban" type="text"></div>
            <div><label for="tx-amount">Importe (€)</label><input id="tx-amount" type="number" min="1" step="0.01"></div>
            <div><label for="tx-concept">Concepto</label><input id="tx-concept" type="text"></div>
          </div>
          <div class="actions"><button class="btn btn-primary" id="btn-send"><svg class="i"><use href="/icons.svg#send"/></svg> Enviar</button></div>
        </section>
        <section class="card" aria-labelledby="mov-title">
          <div class="card-title"><h2 id="mov-title">Movimientos</h2><svg class="i muted"><use href="/icons.svg#activity"/></svg></div>
          <ul class="mov" id="movements"></ul>
        </section>
      </div>
    </main>
  </div>
  <script type="module" src="/js/banco.js"></script>
</body>
</html>
